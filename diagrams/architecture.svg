<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Lab 01 architecture: Wazuh SIEM</title>
  <desc id="desc">Isolated lab network. Agents on dc01, srv01 and ws01 send events to wazuh01 on TCP 1514; the pfSense firewall fw01 sends syslog on UDP 514; the analyst uses the Wazuh dashboard over HTTPS from the management VLAN.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 14; }
      .zone-label { font-size: 13px; font-weight: 600; fill: #475569; }
      .host { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .siem { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 10; }
      .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .role { font-size: 12px; fill: #334155; }
      .ip { font-size: 11px; fill: #64748b; font-family: Consolas, monospace; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-label { font-size: 11px; fill: #0f172a; font-family: Consolas, monospace; }
      .flow-bg { fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#0f172a">Lab 01 — Wazuh SIEM (isolated lab network)</text>

  <!-- VLAN 20: servers -->
  <rect class="zone" x="24" y="56" width="560" height="250"/>
  <text class="zone-label" x="40" y="80">VLAN 20 · Servers · 10.10.20.0/24</text>

  <rect class="siem" x="330" y="100" width="230" height="110"/>
  <text class="name" x="345" y="128">wazuh01</text>
  <text class="role" x="345" y="148">Ubuntu 24.04 · Wazuh 4.14.8</text>
  <text class="role" x="345" y="166">indexer + server + dashboard</text>
  <text class="ip" x="345" y="190">10.10.20.10</text>

  <rect class="host" x="48" y="100" width="200" height="86"/>
  <text class="name" x="63" y="128">dc01</text>
  <text class="role" x="63" y="148">Windows Server 2022 · DC</text>
  <text class="role" x="63" y="166">agent + Sysmon</text>
  <text class="ip" x="178" y="128">10.10.20.11</text>

  <rect class="host" x="48" y="204" width="200" height="86"/>
  <text class="name" x="63" y="232">srv01</text>
  <text class="role" x="63" y="252">Ubuntu 24.04 server</text>
  <text class="role" x="63" y="270">agent + auditd</text>
  <text class="ip" x="178" y="232">10.10.20.12</text>

  <!-- VLAN 30: users -->
  <rect class="zone" x="24" y="326" width="330" height="124"/>
  <text class="zone-label" x="40" y="350">VLAN 30 · Users · 10.10.30.0/24</text>
  <rect class="host" x="48" y="362" width="200" height="76"/>
  <text class="name" x="63" y="390">ws01</text>
  <text class="role" x="63" y="410">Windows 11 · agent + Sysmon</text>
  <text class="ip" x="63" y="428">10.10.30.21</text>

  <!-- VLAN 99: management -->
  <rect class="zone" x="610" y="56" width="266" height="394"/>
  <text class="zone-label" x="626" y="80">VLAN 99 · Management</text>
  <rect class="host" x="636" y="100" width="214" height="86"/>
  <text class="name" x="651" y="128">fw01</text>
  <text class="role" x="651" y="148">pfSense CE · inter-VLAN firewall</text>
  <text class="ip" x="651" y="170">10.10.99.1</text>

  <rect class="host" x="636" y="330" width="214" height="76"/>
  <text class="name" x="651" y="358">Analyst</text>
  <text class="role" x="651" y="378">browser · jump host</text>

  <!-- Flows -->
  <path class="flow" d="M248,143 L330,143"/>
  <rect class="flow-bg" x="258" y="118" width="64" height="16"/>
  <text class="flow-label" x="262" y="130">1514/tcp</text>

  <path class="flow" d="M248,247 L300,247 L300,190 L330,190"/>
  <rect class="flow-bg" x="258" y="252" width="64" height="16"/>
  <text class="flow-label" x="262" y="264">1514/tcp</text>

  <path class="flow" d="M248,400 L445,400 L445,210"/>
  <rect class="flow-bg" x="452" y="300" width="64" height="16"/>
  <text class="flow-label" x="456" y="312">1514/tcp</text>

  <path class="flow" d="M636,143 L560,143"/>
  <rect class="flow-bg" x="566" y="118" width="64" height="16"/>
  <text class="flow-label" x="569" y="130">514/udp</text>

  <path class="flow" d="M636,368 L520,368 L520,210"/>
  <rect class="flow-bg" x="528" y="372" width="96" height="16"/>
  <text class="flow-label" x="531" y="384">443/tcp (UI)</text>
</svg>
